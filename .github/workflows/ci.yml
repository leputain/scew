name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.lock.txt -r requirements-dev.txt

      - name: Compile
        run: python -m compileall -q apps core tests scripts

      - name: Lint
        run: ruff check apps core tests scripts

      - name: Test
        run: python -m pytest -q tests

      - name: Audit publication manifest
        run: python scripts/public_repo_audit.py

      - name: Validate Docker Compose
        env:
          POSTGRES_PASSWORD: ci-compose-placeholder
        run: docker compose config --quiet

      - name: Build container image
        run: |
          docker build \
            --build-arg PIP_NO_INDEX=0 \
            --build-arg APP_VERSION=ci \
            --build-arg BUILD_DATE=1970-01-01T00:00:00Z \
            --build-arg VCS_REF=${{ github.sha }} \
            --tag screw:ci .

      - name: Validate container dependencies
        run: docker run --rm screw:ci python -m pip check
