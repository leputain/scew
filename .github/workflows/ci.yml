name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: screw_forum_test_ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U fixture -d screw_forum_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.lock.txt -r requirements-dev.txt

      - name: Compile
        run: python -m compileall -q apps core tests scripts

      - name: Lint
        run: ruff check apps core tests scripts

      - name: Test
        env:
          FORUM_TOPIC_VERIFY_ISOLATED: "1"
          FORUM_TOPIC_TEST_DSN: postgresql://fixture:synthetic-ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/screw_forum_test_ci
          MEDOED_NOTIFIER_TEST_POSTGRES_DOCKER: "1"
        run: python -m pytest -q tests

      - name: Audit publication manifest
        run: python scripts/public_repo_audit.py

      - name: Validate Docker Compose
        env:
          POSTGRES_PASSWORD: ci-compose-placeholder
        run: docker compose config --quiet

      - name: Build container image
        run: |
          docker build \
            --build-arg PIP_NO_INDEX=0 \
            --build-arg APP_VERSION=ci \
            --build-arg BUILD_DATE=1970-01-01T00:00:00Z \
            --build-arg VCS_REF=${{ github.sha }} \
            --tag screw:ci .

      - name: Validate container dependencies
        run: docker run --rm screw:ci python -m pip check
